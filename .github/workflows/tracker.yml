name: Sleeper Lineup Tracker

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  run-tracker:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tracker
        run: python tracker.py

      - name: Save tracker data
        run: |
          git config user.name "Sleeper Tracker"
          git config user.email "actions@github.com"

          git add current_state.json lineup_changes.csv 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No lineup changes to save."
          else
            git commit -m "Update Sleeper lineup snapshot"
            git push
          fi
