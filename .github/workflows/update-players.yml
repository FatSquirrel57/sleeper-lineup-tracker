name: Update Sleeper Players

on:
  schedule:
    - cron: "15 8 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-players:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Update Sleeper player database
        run: python update_players.py

      - name: Commit player database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add sleeper_players.json

          if git diff --cached --quiet; then
            echo "No player data changed."
          else
            git commit -m "Update Sleeper player database"
            git pull --rebase
            git push
          fi
